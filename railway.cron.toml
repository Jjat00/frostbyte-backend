# Servicio CRON de la Polla Mundialista -- SIN USO (archivo de referencia).
#
# NO hay ningun servicio creado con este archivo, y no debe crearse: tras el
# Mundial 2026 no se sincroniza nada. El sync automatico esta apagado en los dos
# frentes -> el loop in-process (apps/polla/realtime_loop.py) arranca solo con
# POLLA_REALTIME_LOOP=1, y este cron no existe como servicio en Railway.
#
# Se conserva para el proximo torneo: es la alternativa a correr el sync dentro
# del web. OJO: Railway impone un minimo de 5 minutos entre ejecuciones de cron,
# asi que por esta via no se puede sondear cada minuto (de ahi el loop
# in-process, que sondea cada ~20s durante los partidos).
#
# Para usarlo algun dia: crear un servicio aparte apuntando a ESTE repo, con
# este archivo como Config-as-code, y las variables DATABASE_URL, REDIS_URL (las
# mismas del web) y API_FOOTBALL_KEY (ver .env.example).

[build]
builder = "nixpacks"
buildCommand = "pip install -r requirements.txt"

[deploy]
startCommand = "python manage.py polla_sync"
cronSchedule = "*/5 * * * *"
