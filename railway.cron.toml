# Servicio CRON de la Polla Mundialista -- FALLBACK OPCIONAL (no es el mecanismo
# principal de tiempo real).
#
# El tiempo real lo da un loop in-process dentro del servicio web (daphne),
# arrancado en config/asgi.py via apps/polla/realtime_loop.py: sondea cada ~20s
# durante partidos en vivo, sin costo extra y sin el limite de cron de Railway.
#
# Este cron solo sirve como respaldo barato si se quisiera mover el sync fuera
# del web (apagando el loop con POLLA_REALTIME_LOOP=0). OJO: Railway impone un
# minimo de 5 minutos entre ejecuciones de cron, asi que NO se puede correr cada
# minuto por esta via (de ahi el loop in-process).
#
# Para usarlo: crear un servicio aparte apuntando a ESTE repo, con este archivo
# como Config-as-code, y las variables DATABASE_URL, REDIS_URL (las mismas del
# web) y API_FOOTBALL_KEY (ver .env.example).

[build]
builder = "nixpacks"
buildCommand = "pip install -r requirements.txt"

[deploy]
startCommand = "python manage.py polla_sync"
cronSchedule = "*/5 * * * *"
