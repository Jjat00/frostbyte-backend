[build]
builder = "nixpacks"
buildCommand = "pip install -r requirements.txt"

[deploy]
startCommand = "python manage.py migrate && python manage.py seed_cocktail_histories && python manage.py seed_food && python manage.py collectstatic --noinput && daphne -b 0.0.0.0 -p $PORT config.asgi:application"
# Si el proceso se congela, config/liveness.py lo termina con código 1 y
# Railway lo vuelve a levantar.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10