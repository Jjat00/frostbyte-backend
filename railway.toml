[service.app]
buildCommand = "uv sync --locked --no-dev --no-install-project"
releaseCommand = "uv run python manage.py migrate && uv run python manage.py collectstatic --noinput"
startCommand = "uv run python manage.py migrate && uv run python manage.py collectstatic --noinput && uv run gunicorn app.wsgi:application --bind 0.0.0.0:$PORT"